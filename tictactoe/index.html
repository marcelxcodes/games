<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TIC TAC TOE // ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="cabinet">
  <div class="marquee">
    <h1>TIC · TAC · TOE</h1>
    <div class="sub">★ ARCADE EDITION ★</div>
  </div>

  <div class="screen">
    <div class="scanlines"></div>
    <div class="glow-flicker"></div>

    <div class="status-bar">
      <span id="turnLabel">P1 TURN: X</span>
      <span id="score">X:0 O:0 DRAW:0</span>
    </div>

    <div id="message" class="blink">PRESS A CELL TO START</div>

    <div class="board" id="board"></div>

    <div class="controls">
      <button class="btn-coin" id="resetBtn">⟲ INSERT COIN / RESET</button>
    </div>

    <div class="theme-picker" id="themePicker" role="group" aria-label="Theme selection">
      <span class="theme-label">THEME:</span>
      <button class="theme-btn active" data-theme="vice" type="button"><span class="sw s1"></span><span class="sw s2"></span><span class="sw s3"></span>VICE</button>
      <button class="theme-btn" data-theme="serene" type="button"><span class="sw s1"></span><span class="sw s2"></span><span class="sw s3"></span>SERENE</button>
      <button class="theme-btn" data-theme="sunset" type="button"><span class="sw s1"></span><span class="sw s2"></span><span class="sw s3"></span>SUNSET</button>
      <button class="theme-btn" data-theme="space" type="button"><span class="sw s1"></span><span class="sw s2"></span><span class="sw s3"></span>SPACE</button>
    </div>
  </div>

  <div class="footer-note">2 PLAYER MODE — HIGH SCORE NEVER RESETS</div>
</div>

<script src="script.js"></script>
</body>
</html>
